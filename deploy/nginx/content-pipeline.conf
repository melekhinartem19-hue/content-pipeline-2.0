# Публичная статика контент-конвейера: кадры каруселей для Instagram и PDF-лид-магниты воронки.
#
# ВАЖНО: сюда НЕ проксируется диспетчер. У него нет входящего HTTP вообще — воронка ManyChat
# работает push-ом (диспетчер сам пишет ссылки в bot-поля), поэтому открытых портов у приложения
# нет и быть не должно. Nginx здесь только раздаёт файлы.
#
# Установка:
#   sudo cp deploy/nginx/content-pipeline.conf /etc/nginx/sites-available/content-pipeline
#   sudo ln -s /etc/nginx/sites-available/content-pipeline /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d media.ПРИМЕР.ru      # сертификат: HTTPS обязателен, см. README

server {
    listen 80;
    listen [::]:80;
    server_name media.ПРИМЕР.ru;          # ← домен клиента, тот же, что в PUBLIC_BASE_URL

    # Certbot после выпуска сертификата сам добавит сюда редирект на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.ПРИМЕР.ru;

    # Пути подставит certbot; самоподписанный сертификат НЕ подойдёт — Meta не заберёт медиа.
    # ssl_certificate     /etc/letsencrypt/live/media.ПРИМЕР.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.ПРИМЕР.ru/privkey.pem;

    # root = PUBLIC_DIR из dispatcher/.env. Ссылка строится как PUBLIC_BASE_URL/<папка>/<файл>:
    #   /funnel/content-plan.pdf   — лид-магниты воронки
    #   /queue-12/slide-1.png      — кадры карусели для Instagram
    root /var/www/content-pipeline;

    # Каталог не листается: в нём лежат материалы клиента, а не витрина.
    autoindex off;

    # Отдаём только то, что реально положил диспетчер. Ничего не исполняем.
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # PDF открывается в браузере, а не скачивается молча: человек пришёл из директа по ссылке.
    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Content-Disposition "inline";
        add_header Cache-Control "public, max-age=300";
    }

    # Скрытые файлы наружу не отдаём (страховка от случайно положенного .env).
    location ~ /\. {
        deny all;
    }

    client_max_body_size 1m;              # загрузок сюда нет — только раздача
}
